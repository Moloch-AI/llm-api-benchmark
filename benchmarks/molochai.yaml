# MolochAI: one model, three short workloads, streamed.
# https://molochai.dev/docs?utm_source=github&utm_medium=oss&utm_campaign=llm-api-benchmark
#
#   export MOLOCHAI_API_KEY=your-api-key
#   llm-bench run --config molochai.yaml --dry-run    # shows the plan, sends nothing
#   llm-bench run --config molochai.yaml
#
# 3 workloads x 3 prompts x 2 repetitions + 1 warm-up = 19 requests, spaced to the documented
# 60 requests/minute. The gateway does not apply max_tokens (each reply is capped by your plan),
# so the request count is what bounds time and cost here. List model ids with
#   llm-bench models --preset molochai
version: 1
name: molochai
dataset: core-v1
workloads: [short-answer, code-explain, json-generation]
modes: [stream]
repetitions: 2
warmup: 1
concurrency: 1
timeout_s: 120
max_requests: 25
providers:
  - name: molochai-llama-70b
    preset: molochai
    model: llama-3.3-70b-instruct-abliterated
    # To track cost (and to use a budget), copy the current per-token prices yourself:
    # pricing:
    #   input_per_mtok: 0.0     # price per 1M input tokens
    #   output_per_mtok: 0.0    # price per 1M output tokens
    #   currency: USD
    #   source: https://molochai.dev/pricing?utm_source=github&utm_medium=oss&utm_campaign=llm-api-benchmark
    #   checked_on: 2026-01-01  # the date you checked
