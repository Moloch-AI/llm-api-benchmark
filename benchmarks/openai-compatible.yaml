# Any OpenAI-compatible endpoint. This example points at OpenAI's API; for another provider,
# change base_url, api_key_env and model, and set rate_limit_rpm to its published limit.
# The maintainers have not run this file against OpenAI (there is no key in CI): check the
# provider's documentation for the base URL, model ids and limits.
#
#   export OPENAI_API_KEY=...
#   llm-bench models --base-url https://api.openai.com/v1 --api-key-env OPENAI_API_KEY
#   export OPENAI_MODEL=<a model id from that list>
#   llm-bench run --config openai-compatible.yaml --dry-run
version: 1
name: openai-compatible
dataset: core-v1
workloads: [short-answer, code-explain, json-generation]
modes: [stream]
repetitions: 2
warmup: 1
concurrency: 1
timeout_s: 120
max_requests: 25
providers:
  - name: openai
    preset: openai-compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: ${OPENAI_MODEL}
    # Newer OpenAI models take max_completion_tokens instead of max_tokens.
    max_tokens_param: max_completion_tokens
    # rate_limit_rpm: 60   # your account's limit
    # pricing:             # from the provider's pricing page, with the date you checked it
    #   input_per_mtok: 0.0
    #   output_per_mtok: 0.0
    #   currency: USD
    #   source: https://example.com/pricing
    #   checked_on: 2026-01-01
