# Tool-calling dataset. Every prompt and tool definition here was written for this project and is
# MIT-licensed. The tools are never executed: the benchmark only checks the call a model makes
# (which function, which arguments, valid against the schema) and how long it takes.
# Change the version whenever a prompt, a tool, a limit or a check changes.
id: tools
version: 1.0.0
description: >-
  Four tool-calling workloads, three prompts each: picking the right function (or none),
  filling structured arguments, several calls in one reply, and following tool_choice. Small
  synthetic tasks that check the shape of a call; they do not rank models on real agent work.
license: MIT
workloads:
  - id: tool-select
    description: >-
      Pick the right function among four, or answer directly when no tool fits.
    max_tokens: 1024
    tools: &everyday-tools
      - type: function
        function:
          name: get_weather
          description: Current weather for a city.
          parameters:
            type: object
            properties:
              city: {type: string, description: "City name, for example Lisbon."}
              unit: {type: string, enum: [celsius, fahrenheit]}
            required: [city, unit]
            additionalProperties: false
      - type: function
        function:
          name: convert_currency
          description: Convert an amount of money between two currencies.
          parameters:
            type: object
            properties:
              amount: {type: number, exclusiveMinimum: 0}
              from_currency: {type: string, pattern: "^[A-Z]{3}$", description: ISO 4217 code.}
              to_currency: {type: string, pattern: "^[A-Z]{3}$", description: ISO 4217 code.}
            required: [amount, from_currency, to_currency]
            additionalProperties: false
      - type: function
        function:
          name: get_local_time
          description: Current local time in a time zone.
          parameters:
            type: object
            properties:
              timezone:
                type: string
                description: IANA time zone name, for example Europe/London.
            required: [timezone]
            additionalProperties: false
      - type: function
        function:
          name: search_recipes
          description: Find recipes that use the given ingredients.
          parameters:
            type: object
            properties:
              ingredients: {type: array, items: {type: string}, minItems: 1}
              max_minutes: {type: integer, minimum: 1}
            required: [ingredients]
            additionalProperties: false
    prompts:
      - id: weather
        prompt: What is the weather in Lisbon right now? Use celsius.
        checks:
          - {type: tool_call, name: get_weather, arguments: {city: Lisbon, unit: celsius}}
          - {type: tool_args_valid}
          - {type: tool_call_count, max: 1}
      - id: currency
        prompt: Convert 250 euros to Japanese yen.
        checks:
          - type: tool_call
            name: convert_currency
            arguments: {amount: 250, from_currency: EUR, to_currency: JPY}
          - {type: tool_args_valid}
          - {type: tool_call_count, max: 1}
      - id: no-tool-needed
        prompt: >-
          What is the capital of Canada? Answer in one word. You do not need a tool for this.
        checks:
          - {type: no_tool_call}
          - {type: contains, value: Ottawa}

  - id: tool-args
    description: >-
      Fill typed and structured arguments exactly: dates, times, integers in a range, enums
      and lists.
    max_tokens: 1024
    tools:
      - type: function
        function:
          name: create_calendar_event
          description: Create a calendar event.
          parameters:
            type: object
            properties:
              title: {type: string, minLength: 1}
              date: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$", description: YYYY-MM-DD.}
              start_time: {type: string, pattern: "^\\d{2}:\\d{2}$", description: 24-hour HH:MM.}
              duration_minutes: {type: integer, minimum: 5, maximum: 480}
              attendees: {type: array, items: {type: string}}
            required: [title, date, start_time, duration_minutes]
            additionalProperties: false
      - type: function
        function:
          name: set_reminder
          description: Set a reminder that fires after a number of minutes.
          parameters:
            type: object
            properties:
              text: {type: string, minLength: 1}
              minutes_from_now: {type: integer, minimum: 1, maximum: 10080}
            required: [text, minutes_from_now]
            additionalProperties: false
      - type: function
        function:
          name: add_task
          description: Add a task to a to-do list.
          parameters:
            type: object
            properties:
              title: {type: string, minLength: 1}
              priority: {type: string, enum: [low, medium, high]}
              tags: {type: array, items: {type: string}, maxItems: 5}
            required: [title, priority]
            additionalProperties: false
    prompts:
      - id: calendar-event
        prompt: >-
          Schedule a meeting titled "Quarterly planning" on 2026-12-03 at 14:30 for 90 minutes,
          with alex@example.com and sam@example.com.
        checks:
          - type: tool_call
            name: create_calendar_event
            arguments:
              title: Quarterly planning
              date: "2026-12-03"
              start_time: "14:30"
              duration_minutes: 90
              attendees: [alex@example.com, sam@example.com]
          - {type: tool_args_valid}
      - id: reminder
        prompt: Remind me in 45 minutes to call the dentist.
        checks:
          - {type: tool_call, name: set_reminder, arguments: {minutes_from_now: 45}}
          - {type: tool_args_valid}
      - id: task
        prompt: Add a high-priority task "Renew passport", tagged travel and documents.
        checks:
          - type: tool_call
            name: add_task
            arguments: {title: Renew passport, priority: high, tags: [travel, documents]}
          - {type: tool_args_valid}

  - id: tool-parallel
    description: >-
      Requests that need several calls. Counts calls made in one reply; an endpoint that only
      returns one call per reply fails these checks even if it would make the rest in later turns.
    max_tokens: 1024
    tools: *everyday-tools
    prompts:
      - id: two-cities
        prompt: What is the weather in Oslo and in Nairobi? Use celsius for both.
        checks:
          - {type: tool_call_count, min: 2}
          - {type: tool_call, name: get_weather, arguments: {city: Oslo, unit: celsius}}
          - {type: tool_call, name: get_weather, arguments: {city: Nairobi, unit: celsius}}
          - {type: tool_args_valid}
      - id: two-tools
        prompt: >-
          What time is it in Tokyo right now, and what is the weather there in celsius?
        checks:
          - {type: tool_call_count, min: 2}
          - {type: tool_call, name: get_local_time, arguments: {timezone: Asia/Tokyo}}
          - {type: tool_call, name: get_weather, arguments: {city: Tokyo, unit: celsius}}
          - {type: tool_args_valid}
      - id: three-cities
        prompt: Get the current weather in Paris, Berlin and Madrid, in celsius.
        checks:
          - {type: tool_call_count, min: 3}
          - {type: tool_call, name: get_weather, arguments: {city: Madrid, unit: celsius}}
          - {type: tool_args_valid}

  - id: tool-choice
    description: >-
      Follow tool_choice: a named function, "required" and "none". These test whether the
      endpoint passes the setting through and the model obeys it.
    max_tokens: 1024
    tools: *everyday-tools
    prompts:
      - id: forced-function
        prompt: I am planning a trip to Rome next week and want to know what to pack.
        tool_choice: {type: function, function: {name: get_weather}}
        checks:
          - {type: tool_call, name: get_weather, arguments: {city: Rome}}
          - {type: tool_call_count, max: 1}
          - {type: tool_args_valid}
      - id: required
        prompt: I need to know the current time in New York.
        tool_choice: required
        checks:
          - {type: tool_call, name: get_local_time, arguments: {timezone: America/New_York}}
          - {type: tool_args_valid}
      - id: none
        prompt: >-
          What is the weather in Rome? If you cannot look it up, say so in one sentence.
        tool_choice: none
        checks:
          - {type: no_tool_call}
