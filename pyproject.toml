[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-api-benchmark"
dynamic = ["version"]
description = "Reproducible benchmarks for OpenAI-compatible LLM APIs: time to first token, latency, tokens/s, error rates and cost, with request and budget caps."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MolochAI" }]
keywords = [
    "llm",
    "benchmark",
    "llm-benchmark",
    "openai-compatible",
    "latency",
    "ttft",
    "throughput",
    "inference",
    "chat-completions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "build>=1.2",
    "twine>=6.1",
]

[project.scripts]
llm-bench = "llm_api_benchmark.cli:main"

[project.urls]
Repository = "https://github.com/Moloch-AI/llm-api-benchmark"
Documentation = "https://github.com/Moloch-AI/llm-api-benchmark/tree/main/docs"
Issues = "https://github.com/Moloch-AI/llm-api-benchmark/issues"
Changelog = "https://github.com/Moloch-AI/llm-api-benchmark/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/llm_api_benchmark/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_api_benchmark"]

[tool.hatch.build.targets.sdist]
include = [
    "src/llm_api_benchmark",
    "tests",
    "benchmarks",
    "examples",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PT", "RET", "PIE", "T20", "ASYNC"]
# The formatter keeps code within 100 columns; long string literals are left whole.
ignore = ["RUF022", "E501"]

[tool.ruff.lint.per-file-ignores]
"src/llm_api_benchmark/cli.py" = ["T20"]
".github/scripts/*" = ["T20"]
"tests/*" = ["T20", "PT012", "PT018", "ASYNC110"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-rfE"
filterwarnings = ["error", "default::DeprecationWarning", "default::PendingDeprecationWarning"]

[tool.coverage.run]
source = ["llm_api_benchmark"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
